# Ice Bank on your own machine (npm run dev in the Ice Bank repo).
# Nothing here is secret: these values are published in the Ice Bank README.
# Any key can be overridden without editing this file (see Config.java and starter/README.md):
#   -DbaseUrl=http://127.0.0.1:3000           (system property, highest priority)
#   ICEBANK_BASE_URL=http://127.0.0.1:3000    (environment variable)
#   config/local.local.properties             (git-ignored file next to this one)

# Web app and REST API (the API lives under /api/v1)
baseUrl=http://localhost:3000

# Sandbox: id 1 is the only sandbox locally. The key unlocks /test/* and the Ice Mail inbox API.
sandboxId=1
sandboxKey=ICEBANK-LOCAL-KEY

# Appended to persona emails: emma.tremblay + emailSuffix + @icebank.test. Empty locally.
emailSuffix=

# Every seeded persona uses this password.
personaPassword=IceBank#2026

# Database: qa_reader can only read; qa_writer can write (test setup, post_transfer).
jdbcUrl=jdbc:postgresql://localhost:5433/icebank
dbUser=qa_reader
dbPassword=qa_reader
dbWriterUser=qa_writer
dbWriterPassword=qa_writer

# Selenium: true runs Chrome without a window (CI, or when you do not want to watch).
headless=false
# Longest time an explicit wait waits for the page, in seconds.
uiTimeoutSeconds=10
