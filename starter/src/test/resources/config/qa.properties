# Ice Bank QA (hosted). PLACEHOLDERS ONLY: never commit real values to this file.
#
# Get the real values from your instructor, then EITHER
#   1) create src/test/resources/config/qa.local.properties (git-ignored) with the real lines, e.g.
#        baseUrl=https://the-qa-url
#        sandboxId=3
#        sandboxKey=your-personal-key
#        emailSuffix=+s3
#        jdbcUrl=jdbc:postgresql://host:5432/postgres?sslmode=require
#        dbPassword=the-qa-reader-password
#   OR
#   2) set environment variables before running (good for CI):
#        ICEBANK_BASE_URL, ICEBANK_SANDBOX_ID, ICEBANK_SANDBOX_KEY, ICEBANK_EMAIL_SUFFIX,
#        ICEBANK_JDBC_URL, ICEBANK_DB_USER, ICEBANK_DB_PASSWORD
#
# Then run:  mvn test -Denv=qa      (PowerShell: mvn test "-Denv=qa")
# Any value still containing CHANGE_ME stops the run with a message naming the key.

baseUrl=https://CHANGE_ME
sandboxId=CHANGE_ME
# Secret: whoever has it can reset your sandbox and move its clock.
sandboxKey=CHANGE_ME
# Your sandbox's persona email suffix, e.g. +s3 -> emma.tremblay+s3@icebank.test
emailSuffix=+sCHANGE_ME

personaPassword=IceBank#2026

# Secret: the QA database connection (read-only user).
jdbcUrl=jdbc:postgresql://CHANGE_ME:5432/postgres?sslmode=require
dbUser=qa_reader
dbPassword=CHANGE_ME
# There is no writer account on QA: tests that need it are skipped there.
dbWriterUser=
dbWriterPassword=

headless=true
uiTimeoutSeconds=15
