# Run test methods in a random order so hidden order dependencies show up early.
# The seed is printed in the log; reuse it with junit.jupiter.execution.order.random.seed=<seed>.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# Show @DisplayName sentences in the console and reports.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
